<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chetak Creation - Official Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF9B31;
            --secondary: #28D1B4;
            --dark: #1e1e1e;
            --light: #f8f9fa;
            --gray: #e9ecef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; }

        nav { background-color: var(--dark); color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); text-decoration: none; }

        .container { max-width: 1100px; margin: 30px auto; padding: 20px; flex: 1; width: 100%; }
        
        .section-title { margin: 30px 0 15px; font-size: 24px; border-bottom: 3px solid var(--primary); display: inline-block; padding-bottom: 5px; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
        
        .work-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; }
        .work-card:hover { transform: translateY(-5px); }
        .work-card-media { height: 180px; background: #ddd; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .work-card-media img, .work-card-media video { width: 100%; height: 100%; object-fit: cover; }
        .work-card-content { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .work-card-content h3 { font-size: 18px; margin-bottom: 8px; color: var(--dark); }
        .work-card-content p { font-size: 14px; color: #666; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Modal View for Full Details */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; border-radius: 10px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 26px; cursor: pointer; color: #333; }
        .modal-media { width: 100%; max-height: 350px; margin: 15px 0; border-radius: 8px; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
        .modal-media img, .modal-media video { max-width: 100%; max-height: 350px; object-fit: contain; }

        /* Footer */
        footer { background: var(--dark); color: white; text-align: center; padding: 30px 20px; margin-top: auto; }
        .social-links { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .social-links a { color: white; font-size: 24px; transition: color 0.2s; }
        .social-links a:hover { color: var(--primary); }
    </style>
</head>
<body>

    <nav>
        <a href="#" id="navLogo" class="logo">Chetak Creation</a>
    </nav>

    <div class="container">
        <!-- Design Section -->
        <h2 class="section-title">Design Works</h2>
        <div id="designsGrid" class="grid-container">
            <p style="color:#777;">No designs published yet.</p>
        </div>

        <!-- Writings Section -->
        <h2 class="section-title">Blogs & Writings</h2>
        <div id="writingsGrid" class="grid-container">
            <p style="color:#777;">No writings published yet.</p>
        </div>

        <!-- Editing Section -->
        <h2 class="section-title">Editing Works</h2>
        <div id="editingGrid" class="grid-container">
            <p style="color:#777;">No editing works published yet.</p>
        </div>
    </div>

    <!-- Modal Full View -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="color: var(--primary); margin-bottom: 10px;"></h2>
            <div class="modal-media" id="modalMediaContainer"></div>
            <p id="modalDesc" style="font-size: 15px; line-height: 1.6; color: #333; white-space: pre-wrap;"></p>
        </div>
    </div>

    <!-- Footer with Social Media Links -->
    <footer>
        <p>&copy; 2026 Chetak Creation. All rights reserved.</p>
        <div class="social-links" id="footerSocialLinks">
            <a href="#" id="linkYoutube" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            <a href="#" id="linkInstagram" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" id="linkFacebook" target="_blank"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" id="linkWhatsapp" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </footer>

    <script>
        // Load Settings (Logo & Social Links)
        function loadPublicSettings() {
            let settings = JSON.parse(localStorage.getItem('cc_settings')) || {
                logo: "Chetak Creation",
                youtube: "https://youtube.com",
                instagram: "https://instagram.com",
                facebook: "https://facebook.com",
                whatsapp: "https://wa.me"
            };

            document.getElementById('navLogo').innerText = settings.logo;
            document.getElementById('linkYoutube').href = settings.youtube;
            document.getElementById('linkInstagram').href = settings.instagram;
            document.getElementById('linkFacebook').href = settings.facebook;
            document.getElementById('linkWhatsapp').href = settings.whatsapp;
        }

        // Load Published Works
        function renderSection(category, gridId) {
            const grid = document.getElementById(gridId);
            let items = JSON.parse(localStorage.getItem('cc_' + category)) || [];

            if(items.length === 0) {
                grid.innerHTML = `<p style="color:#777;">No items published yet.</p>`;
                return;
            }

            let html = '';
            items.forEach((item, index) => {
                let mediaElement = '';
                if(item.fileType && item.fileType.startsWith('video/')) {
                    mediaElement = `<video src="${item.fileData}"></video>`;
                } else if(item.fileType && item.fileType.startsWith('image/')) {
                    mediaElement = `<img src="${item.fileData}" alt="${item.title}">`;
                } else {
                    mediaElement = `<div style="padding:20px; text-align:center; color:#555;"><i class="fa-solid fa-file-lines fa-3x"></i><p>${item.fileName || 'Document'}</p></div>`;
                }

                html += `
                    <div class="work-card" onclick='openModal(${JSON.stringify(category)}, ${index})'>
                        <div class="work-card-media">${mediaElement}</div>
                        <div class="work-card-content">
                            <div>
                                <h3>${item.title}</h3>
                                <p>${item.desc}</p>
                            </div>
                            <span style="color:var(--primary); font-size:13px; font-weight:bold; margin-top:10px;">Read More / View <i class="fa-solid fa-arrow-right"></i></span>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function openModal(category, index) {
            let items = JSON.parse(localStorage.getItem('cc_' + category)) || [];
            let item = items[index];
            if(!item) return;

            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalDesc').innerText = item.desc;

            let mediaContainer = document.getElementById('modalMediaContainer');
            if(item.fileType && item.fileType.startsWith('video/')) {
                mediaContainer.innerHTML = `<video src="${item.fileData}" controls autoplay style="width:100%; max-height:350px;"></video>`;
            } else if(item.fileType && item.fileType.startsWith('image/')) {
                mediaContainer.innerHTML = `<img src="${item.fileData}" alt="${item.title}">`;
            } else if(item.fileData) {
                mediaContainer.innerHTML = `<a href="${item.fileData}" download="${item.fileName}" style="color:white; padding:20px; display:block; text-align:center;"><i class="fa-solid fa-download fa-2x"></i><br>Download File: ${item.fileName}</a>`;
            } else {
                mediaContainer.innerHTML = '';
            }

            document.getElementById('itemModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('itemModal').style.display = 'none';
            document.getElementById('modalMediaContainer').innerHTML = '';
        }

        window.onclick = function(event) {
            let modal = document.getElementById('itemModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Initialize page
        loadPublicSettings();
        renderSection('designs', 'designsGrid');
        renderSection('writings', 'writingsGrid');
        renderSection('editing', 'editingGrid');
    </script>
</body>
</html>
