<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chetak Creation - Main Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #FF9B31;
            --secondary: #28D1B4;
            --dark: #1e1e1e;
            --light: #f8f9fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); }
        nav { background-color: var(--dark); color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: bold; color: var(--primary); }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        .search-box input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .search-box button { padding: 12px 25px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .posts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .post-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .post-card h3 { margin-bottom: 10px; color: var(--dark); }
        .post-card p { font-size: 14px; color: #555; margin-bottom: 10px; }
        .post-card .tag { display: inline-block; background: var(--secondary); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }
        .post-card img, .post-card video { width: 100%; border-radius: 6px; max-height: 200px; object-fit: cover; }
    </style>
</head>
<body>

    <nav>
        <span class="logo"><i class="fa-solid Layers"></i> Chetak Creation</span>
    </nav>

    <div class="container">
        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by hashtag (e.g. #video)...">
            <button onclick="searchPosts()">Search</button>
        </div>

        <!-- Display Posts Grid -->
        <div id="postsContainer" class="posts-grid">
            <p>Loading posts...</p>
        </div>
    </div>

    <script>
        // 
        const supabaseUrl = 'YOUR_SUPABASE_URL'; // sb_secret_I06jPUu4JdZrlv42ngwJ9Q_LhuDybuU
        const supabaseKey = 'YOUR_SUPABASE_KEY'; // sb_publishable_kynVvOzZH7mzKYik0Io0ug_zfvGEkMO
        
        const { createClient } = supabase;
        const _supabase = createClient(supabaseUrl, supabaseKey);

        // 
        async function loadAllPosts() {
            const container = document.getElementById('postsContainer');
            const { data, error } = await _supabase.from('posts').select('*').order('id', { ascending: false });

            if (error) {
                container.innerHTML = `<p>Error loading posts: ${error.message}</p>`;
                return;
            }

            displayPosts(data);
        }

        // 
        async function searchPosts() {
            const query = document.getElementById('searchInput.value') || document.getElementById('searchInput').value.trim();
            const container = document.getElementById('postsContainer');
            
            let queryBuilder = _supabase.from('posts').select('*');

            if (query) {
                queryBuilder = queryBuilder.ilike('hashtag', `%${query}%`);
            }

            const { data, error } = await queryBuilder.order('id', { ascending: false });

            if (error) {
                container.innerHTML = `<p>Search error: ${error.message}</p>`;
                return;
            }

            displayPosts(data);
        }

        // 
        function displayPosts(posts) {
            const container = document.getElementById('postsContainer');
            if (!posts || posts.length === 0) {
                container.innerHTML = `<p>No content found.</p>`;
                return;
            }

            let html = '';
            posts.forEach(post => {
                let mediaTag = '';
                if (post.file_url) {
                    if (post.file_url.match(/\.(mp4|webm|ogg)$/i)) {
                        mediaTag = `<video src="${post.file_url}" controls></video>`;
                    } else if (post.file_url.match(/\.pdf$/i)) {
                        mediaTag = `<a href="${post.file_url}" target="_blank" style="display:block; padding:10px; background:#eee; text-align:center; border-radius:4px; margin-bottom:10px;"><i class="fa-solid fa-file-pdf"></i> View PDF Document</a>`;
                    } else {
                        mediaTag = `<img src="${post.file_url}" alt="Media">`;
                    }
                }

                html += `
                    <div class="post-card">
                        <span class="tag">${post.hashtag}</span>
                        <h3>${post.title}</h3>
                        <p>${post.content}</p>
                        ${mediaTag}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 
        loadAllPosts();
    </script>
</body>
</html>
