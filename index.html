<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuvaSanghamam 2026 - Live Chat & Main Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #FF9B31; --secondary: #28D1B4; --dark: #1e1e1e; --light: #f4f6f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Anek', 'Segoe UI', sans-serif; }
        body { background-color: var(--light); color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* Floating Live Chat Widget Styles */
        .chat-widget-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .chat-toggle-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        .chat-toggle-btn:hover { transform: scale(1.05); }

        .chat-box-popup {
            position: absolute;
            bottom: 60px;
            right: 0;
            width: 350px;
            height: 480px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #ddd;
            transition: all 0.3s ease;
        }
        .chat-box-popup.hidden { display: none; }

        .chat-popup-header {
            background: var(--dark);
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }
        .chat-popup-header i { cursor: pointer; font-size: 16px; }

        .chat-popup-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
        }
        .chat-bubble.user { background: #e8f5e9; align-self: flex-end; }
        .chat-bubble.admin { background: #e3f2fd; align-self: flex-start; }

        .chat-popup-input-area {
            padding: 10px;
            background: #fff;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-input-row {
            display: flex;
            gap: 6px;
        }
        .chat-input-row input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }
        .chat-send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .chat-file-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #666;
        }

        @font-face {
            font-family: 'Anek';
            src: url('https://selzpjnwbohrjefcgbpj.supabase.co/storage/v1/object/public/uploads/AnekMalayalam-Regular_0.ttf') format('truetype');
        }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <h2>യുവസംഗമം 2026 - Main Page</h2>
        <p style="color: #666; margin-top: 10px;">ഇത് പ്രധാന വെബ്‌സൈറ്റ് പേജ് ആണ്. താഴെയുള്ള ലൈവ് ചാറ്റ് വഴി സംശയങ്ങൾ ചോദിക്കാം.</p>
    </div>

    <!-- Floating Live Chat Widget -->
    <div class="chat-widget-container">
        <button class="chat-toggle-btn" onclick="toggleChatBox()">
            <i class="fa-solid fa-comments"></i> സംശയങ്ങൾ ചോദിക്കാം (Live Chat)
        </button>

        <div id="chatBoxPopup" class="chat-box-popup hidden">
            <div class="chat-popup-header">
                <span>സംശയങ്ങൾ ചോദിക്കാം (Live Chat)</span>
                <i class="fa-solid fa-xmark" onclick="toggleChatBox()"></i>
            </div>
            
            <div class="chat-popup-messages" id="userChatMessages">
                <p style="color:#777; text-align:center; font-size: 12px;">ചാറ്റ് ലോഡ് ചെയ്യുന്നു...</p>
            </div>

            <div class="chat-popup-input-area">
                <div class="chat-input-row">
                    <input type="text" id="userMsgInput" placeholder="സന്ദേശം എഴുതുക..." onkeypress="if(event.key === 'Enter') sendUserMessage()">
                    <button class="chat-send-btn" onclick="sendUserMessage()">Send</button>
                </div>
                <div class="chat-file-row">
                    <span>ഫോട്ടോ/ഫയൽ:</span>
                    <input type="file" id="userFileInput" style="font-size: 10px; width: 160px;">
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://selzpjnwbohrjefcgbpj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlbHpwam53Ym9ocmplZmNnYnBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjYxNTgsImV4cCI6MjEwMjU0MjE1OH0.tUhmcCIqSqauwBZvazbbndPy9wPoRBW33-UcFzmHiSA';
        let supabaseClient = null;
        let currentUserName = localStorage.getItem('vsk_chat_username') || '';

        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch(e) { console.error("Supabase Init Error:", e); }

        function toggleChatBox() {
            const box = document.getElementById('chatBoxPopup');
            box.classList.toggle('hidden');
            if (!box.classList.contains('hidden')) {
                if (!currentUserName) {
                    currentUserName = prompt("ചാറ്റ് ചെയ്യാനായി നിങ്ങളുടെ പേര് നൽകുക:") || "User_" + Math.floor(Math.random() * 1000);
                    localStorage.setItem('vsk_chat_username', currentUserName);
                }
                loadUserMessages();
            }
        }

        // മെസ്സേജിലെ ലിങ്കുകളെ ചിത്രങ്ങളോ ഫയലുകളോ ആയി പാഴ്സ് ചെയ്ത് മാറ്റുന്ന ഫങ്ഷൻ
        function formatChatMessage(rawMessage) {
            let contentHtml = rawMessage || '';
            if (contentHtml.includes('[Image:')) {
                let parts = contentHtml.split('[Image:');
                let textPart = parts[0];
                let imgUrl = parts[1] ? parts[1].replace(']', '').trim() : '';
                contentHtml = `${textPart}<br><img src="${imgUrl}" style="max-width: 160px; border-radius: 6px; margin-top: 5px; display: block; cursor: pointer;" onclick="window.open('${imgUrl}', '_blank')">`;
            } else if (contentHtml.includes('[File:')) {
                let parts = contentHtml.split('[File:');
                let textPart = parts[0];
                let fileUrl = parts[1] ? parts[1].replace(']', '').trim() : '';
                let fileName = fileUrl ? fileUrl.split('/').pop().split('_').pop() : 'Download File';
                contentHtml = `${textPart}<br><a href="${fileUrl}" target="_blank" download style="display: inline-flex; align-items: center; gap: 6px; margin-top: 5px; padding: 4px 8px; background: #fff; border: 1px solid #ccc; border-radius: 4px; color: #333; text-decoration: none; font-size: 11px;"><i class="fa-solid fa-file-arrow-down" style="color:#FF9B31;"></i> ${fileName}</a>`;
            }
            return contentHtml;
        }

        async function loadUserMessages() {
            if (!supabaseClient || !currentUserName) return;
            try {
                const { data, error } = await supabaseClient
                    .from('yuva_chats')
                    .select('*')
                    .or(`sender_name.eq.${currentUserName},recipient_id.eq.${currentUserName}`)
                    .order('id', { ascending: true });

                if (error) throw error;

                let html = '';
                if (data && data.length > 0) {
                    data.forEach(m => {
                        let isUser = m.sender_name === currentUserName;
                        let bubbleClass = isUser ? 'user' : 'admin';
                        let senderLabel = isUser ? '' : '<b>Admin:</b> ';
                        
                        let formattedMsg = formatChatMessage(m.message);

                        html += `
                            <div class="chat-bubble ${bubbleClass}">
                                ${senderLabel}${formattedMsg}
                            </div>
                        `;
                    });
                } else {
                    html = '<p style="color:#777; text-align:center; font-size: 12px;">സന്ദേശങ്ങൾ ഒന്നുമില്ല. നിങ്ങളുടെ സംശയങ്ങൾ ചോദിക്കൂ!</p>';
                }

                const msgBox = document.getElementById('userChatMessages');
                msgBox.innerHTML = html;
                msgBox.scrollTop = msgBox.scrollHeight;
            } catch (e) {
                console.error("Load User Messages Error:", e);
            }
        }

        async function sendUserMessage() {
            const inputEl = document.getElementById('userMsgInput');
            const fileInput = document.getElementById('userFileInput');
            const msgText = inputEl ? inputEl.value.trim() : '';
            const file = fileInput && fileInput.files.length > 0 ? fileInput.files[0] : null;

            if (!msgText && !file) return;

            if (file && file.size > 10 * 1024 * 1024) {
                alert("ഫയലിന്റെ സൈസ് 10MB-ൽ താഴെയായിരിക്കണം!");
                return;
            }

            try {
                let fileUrl = '';
                if (supabaseClient && file) {
                    const fileName = 'user_chat_' + Date.now() + '_' + file.name;
                    const { error: upErr } = await supabaseClient.storage.from('uploads').upload(fileName, file);
                    if (upErr) throw upErr;

                    const { data: pubData } = supabaseClient.storage.from('uploads').getPublicUrl(fileName);
                    fileUrl = pubData.publicUrl;
                }

                let finalMessage = msgText;
                if (fileUrl) {
                    if (fileUrl.match(/\.(jpeg|jpg|png|gif|webp)$/i)) {
                        finalMessage = `${msgText}\n[Image: ${fileUrl}]`;
                    } else {
                        finalMessage = `${msgText}\n[File: ${fileUrl}]`;
                    }
                }

                const { error: insErr } = await supabaseClient.from('yuva_chats').insert([{
                    sender_name: currentUserName,
                    recipient_id: 'Admin',
                    message: finalMessage,
                    is_admin: false
                }]);

                if (insErr) throw insErr;

                if (inputEl) inputEl.value = '';
                if (fileInput) fileInput.value = '';
                loadUserMessages();
            } catch (e) {
                console.error("Send Message Error:", e);
                alert("സന്ദേശം അയക്കുന്നതിൽ പരാജയപ്പെട്ടു.");
            }
        }
    </script>
</body>
</html>
